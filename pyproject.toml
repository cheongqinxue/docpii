[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docpii"
version = "0.1.0"
description = "PII/PCI/PHI entity discovery with NuExtract3 — evaluation and QLoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "docpii contributors" }]
keywords = ["pii", "vlm", "nuextract", "document-extraction", "qlora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "numind>=0.1",
    "openai>=1.40",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.3",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
train = [
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    "peft>=0.12",
    "torch>=2.3",
    "transformers>=4.45",
    "trl>=0.11",
]
transformers = [
    "torch>=2.3",
    "transformers>=4.45",
]
vllm = [
    "vllm>=0.10",
]
all = ["docpii[pdf,train,transformers,vllm]"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
docpii = "docpii.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docpii"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
packages = ["docpii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
